name: daily-carousel

on:
  # NOTE: no `schedule:` here on purpose. GitHub's scheduled cron is heavily delayed (a "06:30"
  # run was landing ~12:33 UTC), which broke the "draft in the morning" goal. Instead the
  # Cloudflare Worker's punctual cron (wrangler.toml [triggers], 03:40 UTC / 09:10 IST)
  # dispatches this workflow — and workflow_dispatch runs start promptly.
  workflow_dispatch:           # manual run button + Worker/agent dispatch target
    inputs:
      dry_run:
        description: "Generate only, do not post"
        type: boolean
        default: false
      force_style:
        description: "Force art style: iso (isometric 3D diorama) | glossy (octane 3D) | '' = normal rotation"
        type: string
        default: ""
      avoid_title:
        description: "Story title to rule out (from the '🔁 Different story' button) | '' = no extra exclusion"
        type: string
        default: ""

permissions:
  contents: write              # to commit updated state/ ledger back

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Open the repo to public for the whole draft + Telegram-approval window.
      # publish.yml flips it back to private the moment the Instagram post lands.
      - name: Make repo public (draft/approval window open)
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: gh api -X PATCH "repos/${{ github.repository }}" -F private=false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: System deps (ffmpeg + chrome)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg google-chrome-stable || sudo apt-get install -y -qq ffmpeg chromium-browser

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Cache u2net model (rembg cut-outs)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1

      - name: Kaggle auth (KGAT access token)
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "${{ secrets.KAGGLE_ACCESS_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Run pipeline
        env:
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
          CLOUDINARY_URL:   ${{ secrets.CLOUDINARY_URL }}
          IG_ACCESS_TOKEN:  ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CHROME_BIN:       /usr/bin/google-chrome
          FORCE_STYLE:      ${{ inputs.force_style }}
          AVOID_TITLE:      ${{ inputs.avoid_title }}
        run: python pipeline.py ${{ (inputs.dry_run && '--dry-run') || '' }}

      # Without this, a hard crash (e.g. the 2026-08-13 Kaggle sm_60 kernel ERROR) looks
      # EXACTLY like "nothing happened" from Telegram's side — no draft, no explanation.
      - name: Telegram alert on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG=$(printf '%s\n%s' \
            "⚠️ everydayhype daily-carousel FAILED — no draft today." \
            "Logs: ${RUN_URL}")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}"

      - name: Upload preview slides
        if: always()
        continue-on-error: true      # a non-essential preview must NEVER fail the run and
                                     # skip the queue-commit below (storage-quota errors did
                                     # exactly that, freezing pending.json since 2026-07-10)
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides
          path: work/slides/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Persist queued post (state/pending.json)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "peacestate"
          git config user.email "229365184+peacestate@users.noreply.github.com"
          git add state/
          git commit -m "queue: $(date -u +%F)" || echo "no changes"
          # The freshly generated post is authoritative. Bring in remote history but keep OUR
          # state/*.json whenever it conflicts — this stops the old --autostash rebase from
          # committing <<<<<< merge-conflict markers when the Telegram worker wrote pending.json
          # at the same instant (that corruption was breaking every button tap afterwards).
          for i in 1 2 3; do
            git fetch origin main || true
            git merge -X ours --no-edit origin/main || { git merge --abort || true; }
            git push && break || { echo "push race; retrying in 5s"; sleep 5; }
          done

      # The repo is opened to public at step 1 so Actions minutes stay free, and publish.yml
      # closes it again once the Instagram post lands. That handshake only covers the happy
      # path — a crash, a dry-run or a rejected draft means NO publish is ever coming, so
      # nothing closed the window (2026-08-13: left public 2.7h after a crash, then again
      # after a dry-run). Close it ourselves whenever a publish is not on the way.
      - name: Re-private if no publish is coming (crash / dry-run)
        if: always() && (failure() || cancelled() || inputs.dry_run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: gh api -X PATCH "repos/${{ github.repository }}" -F private=true
